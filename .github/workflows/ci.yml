name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: 10.0.x }
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Vulnerable NuGet packages (security rule 22)
        run: dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt; ! grep -Eq "High|Critical" vuln.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: test-results, path: "**/TestResults/*.trx" }
  portal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: portal/package-lock.json }
      - run: npm ci
        working-directory: portal
      - run: npm run build
        working-directory: portal
      - name: npm audit (security rule 22)
        run: npm audit --audit-level=high
        working-directory: portal
  docker:
    runs-on: ubuntu-24.04
    needs: [build-test, portal]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - run: docker buildx build --platform linux/amd64,linux/arm64 -t pdf-template-service:ci .
